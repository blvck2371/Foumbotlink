<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; padding: 0; width: 1024px; height: 500px; overflow: hidden; background: #0a0a0a; }
  .wrap { position: relative; width: 1024px; height: 500px; overflow: hidden;
    background:
      radial-gradient(520px 420px at 790px 330px, rgba(232,89,12,.30), transparent 70%),
      radial-gradient(420px 320px at 120px 520px, rgba(76,110,245,.18), transparent 70%),
      #0a0a0a; }
  .map { position: absolute; right: -40px; top: -70px; height: 640px; opacity: .14; }
  .text { position: absolute; left: 64px; top: 92px; width: 470px; font-family: "Avenir Next", "Helvetica Neue", Helvetica, Arial, sans-serif; color: #f4f4f4; }
  .eyebrow { margin: 0; color: #ff8a3d; font-weight: 700; font-size: 15px; letter-spacing: .14em; text-transform: uppercase; }
  h1 { margin: 10px 0 14px; font-size: 64px; line-height: 1; font-weight: 800; letter-spacing: -.02em; }
  h1 span { color: #ff6b1a; }
  .tag { margin: 0; font-size: 22px; line-height: 1.35; color: #c9c9c9; font-weight: 500; }
  .chips { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 26px; }
  .chip { padding: 8px 15px; border-radius: 999px; font-size: 15px; font-weight: 600; color: #f4f4f4;
    background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.16); }
  svg.people { position: absolute; left: 0; top: 0; }
</style>
</head>
<body>
<div class="wrap">
  <img class="map" src="file:///Users/test/Desktop/Foumbotlink/assets/branding/map_transparent_dark.png" alt="">

  <div class="text">
    <p class="eyebrow">L'appli des habitants</p>
    <h1>Foumbot <span>Link</span></h1>
    <p class="tag">Actualités, messages, appels, marché et démarches : toute la ville dans votre poche.</p>
    <div class="chips">
      <span class="chip">Actualités</span>
      <span class="chip">Messagerie</span>
      <span class="chip">Appels vidéo</span>
      <span class="chip">Marché</span>

      <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
        <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity=".45"/>
      </filter>
    </defs>

    <!-- ===== Personne 1 : femme au foulard (arrière gauche) ===== -->

      <path d="M572,210 Q600,198 630,210" stroke="#e8590c" stroke-width="4" fill="none" stroke-linecap="round"/>

      <path d="M862,290 Q880,316 898,290 Z" fill="#237a34"/>
      <circle cx="880" cy="214" r="58" fill="#1c120c"/>
      <rect x="869" y="258" width="22" height="38" rx="8" fill="#4a2a18"/>

      <path d="M848,222 Q850,176 880,174 Q912,176 914,222 Q900,198 880,198 Q860,198 848,222 Z" fill="#1c120c"/>

      <circle cx="912" cy="248" r="5" fill="#f2c94c"/>

      <path d="M804,420 Q790,446 758,440" stroke="#3b5bdb" stroke-width="30" fill="none" stroke-linecap="round"/>
      <rect x="719" y="398" width="42" height="68" rx="8" fill="#141414"/>

      <circle cx="724" cy="440" r="11" fill="#8d5524"/>

      <path d="M976,182 L986,176 L986,196 L976,190 Z" fill="#fff"/>

      <circle cx="712" cy="178" r="24" fill="#2f9e44"/>
      <path d="M700,174 L724,174 L721,194 L703,194 Z" fill="#fff"/>
      <path d="M706,174 Q706,162 712,162 Q718,162 718,174" stroke="#fff" stroke-width="3" fill="none"/>

</div>
</body>
</html>
